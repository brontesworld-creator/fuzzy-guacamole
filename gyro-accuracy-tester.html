<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gyroscope Accuracy Tester</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 15, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.4);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .stats-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stats-box">Score: <span id="score-val">0</span></div>
        <div class="stats-box">Avg Time: <span id="accuracy-val">0.00</span>s</div>
    </div>

    <div id="menu">
        <h1>Gyro Accuracy Calibration</h1>
        <p>Tilt your device to move the crosshair.<br>Hover over targets to auto-shoot.</p>
        <button id="start-btn">START GAME</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const menu = document.getElementById('menu');
        const scoreVal = document.getElementById('score-val');
        const accuracyVal = document.getElementById('accuracy-val');

        // Game Configuration
        let score = 0;
        let totalReactionTime = 0;
        let hits = 0;
        let gameActive = false;

        // Crosshair position (centered initially)
        let crosshair = { x: 0, y: 0, radius: 15, sensitivity: 3.5 };
        
        // Gyro data offsets for calibration
        let gyro = { alpha: 0, beta: 0, gamma: 0 };
        let initialOrientation = null;

        // Target Object
        let target = { x: 0, y: 0, radius: 25, spawnTime: 0 };

        // Handle canvas sizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (!gameActive) {
                crosshair.x = canvas.width / 2;
                crosshair.y = canvas.height / 2;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Spawn a random target
        function spawnTarget() {
            const padding = 40;
            target.x = padding + Math.random() * (canvas.width - padding * 2);
            target.y = padding + Math.random() * (canvas.height - padding * 2);
            target.radius = 20 + Math.random() * 15; // Random sizes to test precision
            target.spawnTime = performance.now();
        }

        // Setup Device Orientation Controls
        function initGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ requirement
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            startGame();
                        } else {
                            alert('Permission to access gyroscope was denied.');
                        }
                    })
                    .catch(console.error);
            } else {
                // Android or non-iOS standard platforms
                window.addEventListener('deviceorientation', handleOrientation);
                startGame();
            }
        }

        function handleOrientation(event) {
            if (!gameActive) return;

            // Anchor the baseline angle on first read
            if (!initialOrientation) {
                initialOrientation = { beta: event.beta, gamma: event.gamma };
            }

            // Calculate tilt relative to starting position
            let deltaGamma = event.gamma - initialOrientation.gamma; // Left/Right tilt
            let deltaBeta = event.beta - initialOrientation.beta;   // Forward/Backward tilt

            // Update crosshair coordinates based on gyro changes
            crosshair.x = (canvas.width / 2) + (deltaGamma * crosshair.sensitivity);
            crosshair.y = (canvas.height / 2) + (deltaBeta * crosshair.sensitivity);

            // Keep crosshair inside screen boundaries
            crosshair.x = Math.max(0, Math.min(canvas.width, crosshair.x));
            crosshair.y = Math.max(0, Math.min(canvas.height, crosshair.y));
        }

        function startGame() {
            menu.style.display = 'none';
            score = 0;
            hits = 0;
            totalReactionTime = 0;
            scoreVal.textContent = score;
            accuracyVal.textContent = "0.00";
            gameActive = true;
            initialOrientation = null; // Re-calibrate baseline
            spawnTarget();
            requestAnimationFrame(gameLoop);
        }

        // Core Game Loop
        function gameLoop() {
            if (!gameActive) return;

            // Clear screen
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Target
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3333';
            ctx.fill();
            // Inner bullseye ring
            ctx.beginPath();
            ctx.arc(target.x, target.y, target.radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Check distance for Auto-Shoot Mechanism
            let dx = crosshair.x - target.x;
            let dy = crosshair.y - target.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            // Auto-shoot condition met (Crosshair overlaps target)
            if (distance < target.radius + 5) {
                handleHit();
            }

            // Draw Crosshair
            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(crosshair.x, crosshair.y, crosshair.radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Reticle Lines
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(crosshair.x - 25, crosshair.y); ctx.lineTo(crosshair.x + 25, crosshair.y);
            ctx.moveTo(crosshair.x, crosshair.y - 25); ctx.lineTo(crosshair.x, crosshair.y + 25);
            ctx.stroke();

            requestAnimationFrame(gameLoop);
        }

        function handleHit() {
            // Flash screen effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Track reaction metrics
            hits++;
            score += 100;
            let timeTaken = (performance.now() - target.spawnTime) / 1000; // in seconds
            totalReactionTime += timeTaken;

            // Update UI elements
            scoreVal.textContent = score;
            accuracyVal.textContent = (totalReactionTime / hits).toFixed(2);

            // Spawn next target
            spawnTarget();
        }

        startBtn.addEventListener('click', initGyro);
    </script>
</body>
</html>
